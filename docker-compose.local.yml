# Local testing stack: always builds both images from source
# (no GHCR pull). Usage: docker compose -f docker-compose.local.yml up -d --build
services:
  backend:
    build:
      context: ./backend
    container_name: kanban-backend-local
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - ./pb_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: kanban-frontend-local
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
