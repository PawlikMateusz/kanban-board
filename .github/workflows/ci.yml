name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/pawlikmateusz/kanban-backend
  FRONTEND_IMAGE: ghcr.io/pawlikmateusz/kanban-frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint & build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (type-check + vite build)
        run: npm run build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend test image
        run: docker build -t kanban-backend:latest ./backend
      - name: Run Playwright e2e tests
        run: npm run test:e2e
        working-directory: frontend

  build-and-push:
    name: Build & push container images
    runs-on: ubuntu-latest
    needs: [frontend, e2e]
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Configure git
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Semantic release (version + changelog)
        if: github.ref == 'refs/heads/main'
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          branch: main
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHORT_SHA="${{ github.event.pull_request.head.sha }}"
            SHORT_SHA="${SHORT_SHA:0:7}"
            echo "tags=pr-${{ github.event.pull_request.number }}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ steps.semantic.outputs.new_release_version }}" ]; then
            echo "tags=latest,${{ steps.semantic.outputs.new_release_version }}" >> "$GITHUB_OUTPUT"
            echo "short_sha=" >> "$GITHUB_OUTPUT"
          else
            echo "tags=latest,${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "short_sha=" >> "$GITHUB_OUTPUT"
          fi
      - name: Build & push backend
        if: steps.meta.outputs.tags != ''
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push frontend
        if: steps.meta.outputs.tags != ''
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Comment on PR with testable images
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body \
            "Container images ready for testing:
            - \`${{ env.BACKEND_IMAGE }}:pr-${{ github.event.pull_request.number }}-${{ steps.meta.outputs.short_sha }}\`
            - \`${{ env.FRONTEND_IMAGE }}:pr-${{ github.event.pull_request.number }}-${{ steps.meta.outputs.short_sha }}\`
            - Test locally by pulling and running those tags."
